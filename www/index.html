<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080f1e"><title>Trade Spotlight</title>
<style>
:root{--bg:#080f1e;--p:#142139;--l:#293b56;--t:#edf4ff;--m:#91a2bb;--g:#35dda2;--r:#ff7186}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif;padding:0 0 30px}
header{padding:20px 16px;background:linear-gradient(135deg,#142b48,#101a2d);border-bottom:1px solid var(--l)}
h1{font-size:20px;margin:0}#upd{font-size:11px;color:var(--m);margin-top:8px;line-height:1.6}
main{max-width:800px;margin:auto;padding:12px}
input{width:100%;background:#0e192c;color:#fff;border:1px solid var(--l);border-radius:10px;padding:12px;margin:6px 0 10px;font-size:14px}
.row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:8px}
.pill{border:1px solid var(--l);border-radius:20px;padding:8px 13px;background:var(--p);color:#b7c5d8;font-size:12px}
.pill.on{background:#174c43;color:#68f0bd;border-color:#238c70}
.card{background:linear-gradient(150deg,#172740,#101a2b);border:1px solid #293d59;border-radius:14px;margin:10px 0;padding:14px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.sym{font-size:17px;font-weight:800}.sub{font-size:11px;color:var(--m);margin-top:4px;line-height:1.5}
.tag{padding:5px 10px;border-radius:7px;font-size:11px;font-weight:800}
.BUY{background:#124c3a;color:#65e8b4}.SELL{background:#542637;color:#ff91a1}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.b{background:#0c1729;border:1px solid #263750;padding:9px 7px;border-radius:10px;min-width:0}
.b label{display:block;font-size:9px;color:var(--m);margin-bottom:5px}.b strong{font-size:14px;overflow-wrap:anywhere}
.tg strong{color:var(--g)}.sl strong{color:var(--r)}
.met{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;font-size:11px;color:var(--m)}.met b{color:#fff}
a{color:#70d3ff;font-size:12px;text-decoration:none}.empty{padding:25px;text-align:center;color:var(--m);background:var(--p);border-radius:14px}
.btn{border:1px solid #168565;background:#12624d;color:#8af4c9;border-radius:9px;padding:10px 14px;font-size:12px;font-weight:700}
.foot{font-size:10px;color:#71839c;line-height:1.6;margin-top:14px}
</style></head><body>
<header><h1>Trade Spotlight</h1><div id="upd">Loading...</div></header>
<main>
<input id="q" placeholder="Search stock or broker...">
<div class="row" id="fc"></div>
<div id="list"><div class="empty">Loading...</div></div>
<button class="btn" id="ref">↻ Refresh</button>
<div class="foot">Source: Moneycontrol Trade Spotlight, last 10 days. CMP is the price when the article was published, not live. Targets and stop loss are the experts' views, not advice. Verify before trading.</div>
</main>
<script>
const URL_="https://raw.githubusercontent.com/mvthegreat-appbuild/TradeSpotlight/main/picks.json";
let D=null,flt="ALL",qs="";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cash=n=>n>0?"₹"+Number(n).toLocaleString("en-IN",{maximumFractionDigits:2}):"—";
function ago(d){const n=Math.round((Date.now()-new Date(d+"T00:00:00"))/864e5);return n<=0?"today":n+"d ago"}
function card(p){
 const t=p.targets||[],t1=t[0],buy=p.call==="BUY",sl=p.stop_loss;
 const up=t1&&p.cmp?((buy?t1-p.cmp:p.cmp-t1)/p.cmp*100).toFixed(1)+"%":"—";
 const rk=sl&&p.cmp?((buy?p.cmp-sl:sl-p.cmp)/p.cmp*100).toFixed(1)+"%":"—";
 const rr=t1&&sl&&p.cmp?(()=>{const a=buy?t1-p.cmp:p.cmp-t1,b=buy?p.cmp-sl:sl-p.cmp;return a>0&&b>0?"1 : "+(a/b).toFixed(2):"—"})():"—";
 return `<article class="card"><div class="top"><div><div class="sym">${esc(p.stock)}</div>
 <div class="sub">${esc(p.broker||"Broker not named")} · ${esc(p.date)} (${ago(p.date)})<br>Period: ${esc(p.period||"not given")}</div></div>
 <span class="tag ${esc(p.call)}">${esc(p.call)}</span></div>
 <div class="grid"><div class="b"><label>CMP (article date)</label><strong>${cash(p.cmp)}</strong></div>
 <div class="b tg"><label>Target 1</label><strong>${cash(t1)}</strong></div>
 <div class="b sl"><label>Stop Loss</label><strong>${cash(sl)}</strong></div></div>
 ${t[1]?`<div class="grid"><div class="b tg"><label>Target 2</label><strong>${cash(t[1])}</strong></div></div>`:""}
 <div class="met"><span>Upside <b style="color:var(--g)">${up}</b></span><span>Risk <b style="color:var(--r)">${rk}</b></span><span>R/R <b>${rr}</b></span></div>
 <div style="margin-top:10px"><a href="${esc(p.link)}" target="_blank" rel="noopener">Read original ↗</a></div></article>`}
function render(){
 if(!D)return;
 const all=D.picks||[];
 document.getElementById("fc").innerHTML=["ALL","BUY","SELL"].map(x=>`<button class="pill ${x===flt?"on":""}" data-f="${x}">${x} ${x==="ALL"?all.length:all.filter(p=>p.call===x).length}</button>`).join("");
 const q=qs.toLowerCase();
 const R=all.filter(p=>(flt==="ALL"||p.call===flt)&&(!q||(p.stock+" "+(p.broker||"")).toLowerCase().includes(q)));
 document.getElementById("list").innerHTML=R.length?R.map(card).join(""):'<div class="empty">No picks found.</div>';
}
async function load(){
 const u=document.getElementById("upd");let ok=false;
 try{const r=await fetch(URL_+"?t="+Date.now());if(!r.ok)throw 0;D=await r.json();localStorage.setItem("ts_cache",JSON.stringify(D));ok=true}
 catch(e){try{D=JSON.parse(localStorage.getItem("ts_cache")||"null")}catch(x){D=null}}
 if(D){render();u.innerHTML=(ok?"Data refreshed":"Saved copy (offline)")+"<br>Picks updated: <b>"+esc(new Date(D.updated).toLocaleString("en-IN"))+"</b> · Articles read: "+esc(D.articles)}
 else{u.textContent="Unable to load. Check internet and tap Refresh.";document.getElementById("list").innerHTML='<div class="empty">No data yet.</div>'}
}
document.getElementById("fc").addEventListener("click",e=>{const b=e.target.closest("[data-f]");if(b){flt=b.dataset.f;render()}});
document.getElementById("q").addEventListener("input",e=>{qs=e.target.value;render()});
document.getElementById("ref").addEventListener("click",load);
load();document.addEventListener("visibilitychange",()=>{if(!document.hidden)load()});
</script></body></html>
