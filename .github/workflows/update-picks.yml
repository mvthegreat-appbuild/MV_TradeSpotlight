name: Update picks
on:
  schedule:
    # Every day at 8:00 AM India time
    - cron: "30 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4 lxml googlenewsdecoder
      - run: python fetch_picks.py
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add picks.json
          git commit -m "update picks" || echo "no changes"
          git push
